# Builds and publishes the site to GitHub Pages, refreshing Strava data first.
# Runs on every push to main, every 6 hours (so new runs appear), and on demand.
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # commit refreshed Strava data when it changes
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh Strava data
        run: node scripts/strava.mjs
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
      - name: Commit refreshed Strava data
        run: |
          if [ -n "$(git status --porcelain -- data/strava-bests.json public/data/strava.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/strava-bests.json public/data/strava.json
            git commit -m "Update Strava running data"
            git push
          fi
      - run: npm run build
        env:
          VITE_VISIT_HOOK: ${{ secrets.VISIT_HOOK }}
          VITE_VISIT_KEY: ${{ secrets.VISIT_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
